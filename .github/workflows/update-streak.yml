name: Update Personal Coding Streak

on:
  schedule:
    # Runs every day at approximately 12:05 AM IST
    - cron: "35 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Streak Card
        run: python scripts/update_streak.py

      - name: Commit Updated Streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/streak-card.svg

          git diff --cached --quiet || git commit -m "🔥 Update personal coding streak"

          git push
